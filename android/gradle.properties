# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# R8 full mode is the AGP 8 default and it is what broke the Play build while every debug APK
# stayed fine: it rewrote Capacitor plugin method bodies to `throw null`, so opening the map
# crashed in Bridge.getPermissionStates(). Keep rules patched that one case, but full mode keeps
# making the same class of assumption about any plugin added later -- and the failure only ever
# shows up after upload, never on a device here. Compatibility mode costs a little APK size and
# buys back a release build that behaves like the one we test.
android.enableR8.fullMode=false



